# Example Environment Configuration for Smart Hospital Backend
spring.application.name=hospital-management
server.port=8081

# Database Configuration (Provide your local or production database credentials)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/hospital_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:your_db_username}
spring.datasource.password=${DB_PASSWORD:your_db_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret - 256-bit Base64-encoded secret key
jwt.secret=${JWT_SECRET:your_256_bit_base64_secret_key_here}
jwt.expiration=86400000

logging.level.com.hospital=INFO
